<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Local Download</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e8ec; --mut:#8b93a1; --card:#181b22; --acc:#7b5cff; --ok:#3ecf8e; --err:#ff6b6b; --warn:#f5b84b; }
  * { box-sizing: border-box; }
  body { font: 15px system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0 auto; padding: 16px; max-width: 760px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; color: var(--mut); margin: 24px 0 8px; font-weight: 600; }
  #f { display: flex; gap: 8px; }
  input, select, button { font: inherit; color: inherit; background: var(--card); border: 1px solid #2a2f3a; border-radius: 8px; padding: 9px 12px; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button.primary { background: var(--acc); border-color: var(--acc); }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tabs button.on { border-color: var(--acc); }
  .item { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  .item img { width: 46px; height: 68px; object-fit: cover; border-radius: 6px; background: #222; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s { color: var(--mut); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: #2a2f3a; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--acc); }
  .complete .bar > div { background: var(--ok); }
  .error .s { color: var(--err); }
  .paused .bar > div { background: var(--mut); }
  dialog { background: var(--bg); color: var(--fg); border: 1px solid #2a2f3a; border-radius: 12px; width: min(720px, calc(100vw - 32px)); max-height: 85vh; padding: 14px; }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .cand { padding: 8px 0; border-bottom: 1px solid #2a2f3a; display: flex; gap: 10px; align-items: center; }
  .cand .t, .cand .s { white-space: normal; word-break: break-word; }
  .cand .t { font-weight: 500; font-size: 14px; }
  .cand.rejected { opacity: .55; }
  .cand.current .t::before { content: '● '; color: var(--ok); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .actions button, .actions .btn { padding: 5px 10px; font-size: 13px; }
  a.btn { color: inherit; text-decoration: none; background: var(--card); border: 1px solid #2a2f3a; border-radius: 8px; }
  .eps { margin: -2px 0 10px 8px; padding-left: 8px; border-left: 2px solid #2a2f3a; }
  .ep { display: flex; gap: 8px; align-items: center; padding: 5px 0; }
  nav { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #2a2f3a; }
  nav a { color: var(--mut); text-decoration: none; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav a.on { color: var(--fg); border-color: var(--acc); }
  #settingsForm { margin-bottom: 14px; }
  fieldset { border: 1px solid #2a2f3a; border-radius: 10px; margin: 0 0 14px; padding: 10px 14px 14px; }
  legend { color: var(--mut); padding: 0 6px; font-weight: 600; }
  .field { display: grid; gap: 4px; margin-top: 10px; }
  .field label { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .field input, .field select { width: 100%; }
  .field .help { color: var(--mut); font-size: 12px; }
  .field.bad input, .field.bad select { border-color: var(--err); }
  a.reset { color: var(--acc); font-size: 12px; cursor: pointer; margin-left: auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .msg { font-size: 13px; color: var(--mut); }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .msg.warn { color: var(--warn); }
  code { background: var(--card); padding: 2px 6px; border-radius: 6px; word-break: break-all; font-size: 13px; }
</style>
</head>
<body>
<h1>Download to server</h1>
<nav>
  <a href="#add" data-view="add">Add</a>
  <a href="#downloads" data-view="downloads">Downloads</a>
  <a href="#settings" data-view="settings">Settings</a>
</nav>

<section id="v-add">
<div class="tabs">
  <button id="tMovie" class="on">Movies</button>
  <button id="tSeries">Series</button>
</div>
<form id="f"><input id="q" placeholder="Search title..." autocomplete="off"><button class="primary">Search</button></form>
<div id="results"></div>
</section>

<dialog id="picker">
  <div class="row" style="margin-top:0"><strong id="pickTitle" class="grow"></strong><button type="button" id="pickClose">Close</button></div>
  <div id="pickBody"></div>
</dialog>

<section id="v-downloads" hidden>
<div id="downloads"></div>
</section>

<section id="v-settings" hidden>
<form id="settingsForm" novalidate></form>
<fieldset>
  <legend>Stremio</legend>
  <div class="field"><label>Install URL (paste into Stremio &rarr; Add-ons)</label><code id="manifestUrl"></code></div>
  <div class="row">
    <button type="button" id="rotate">Rotate token</button>
    <span class="msg">Creates a new secret URL. The old one stops working; reinstall the add-on in Stremio.</span>
  </div>
</fieldset>
</section>

<script>
const BASE = location.pathname.replace(/\/?$/, '/');
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
let type = 'movie';

async function api(p, opts) {
  const r = await fetch(BASE + p, opts);
  if (!r.ok) {
    const text = await r.text();
    let err;
    try { err = Object.assign(new Error(JSON.parse(text).error), JSON.parse(text)); } catch { err = new Error(text.slice(0, 200)); }
    throw err;
  }
  return r.json();
}
const send = (method, p, body) => api(p, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

// ---- views ----
function show() {
  const v = (location.hash.slice(1) || 'add').split('?')[0];
  const name = ['add', 'downloads', 'settings'].includes(v) ? v : 'add';
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.dataset.view === name));
  document.querySelectorAll('section').forEach((x) => (x.hidden = x.id !== 'v-' + name));
  if (name === 'settings') loadSettings();
}
window.addEventListener('hashchange', show);

function setType(t) {
  type = t;
  $('#tMovie').classList.toggle('on', t === 'movie');
  $('#tSeries').classList.toggle('on', t === 'series');
  $('#results').replaceChildren();
}
$('#tMovie').onclick = () => setType('movie');
$('#tSeries').onclick = () => setType('series');

async function startDownload(t, id, btn) {
  btn.disabled = true; btn.textContent = 'Queued...';
  try {
    await send('POST', 'api/download', { type: t, id });
    btn.textContent = 'Started';
  } catch (e) {
    btn.textContent = 'Failed'; btn.title = e.message; btn.disabled = false;
  }
  refresh();
}

// Latest download list by ID, so open episode lists can show what is already on the server.
let known = new Map();
let pendingIds = new Set();
const openLists = new Set(); // re-render callbacks of open episode lists

function epState(id) {
  const d = known.get(id);
  if (!d) return pendingIds.has(id) ? { text: 'Looking for a torrent...', busy: true } : null;
  const pct = Math.round((d.progress || 0) * 100);
  if (d.status === 'complete') return { text: 'On server', busy: true, cls: 'ok' };
  if (d.status === 'downloading' || d.status === 'queued') return { text: d.paused ? `Paused ${pct}%` : `${pct}%`, busy: true };
  if (d.status === 'error') return { text: 'Failed', title: d.error, cls: 'err' };
  return null; // missing: can be downloaded again
}

async function batchDownload(id, season, btn, msg) {
  btn.disabled = true;
  msg.className = 'msg'; msg.textContent = 'Queueing...';
  try {
    const r = await send('POST', 'api/download/batch', season ? { id, season } : { id });
    const why = {};
    r.skipped.forEach((x) => (why[x.reason] = (why[x.reason] || 0) + 1));
    const skipped = Object.entries(why).map(([k, n]) => `${n} ${k}`).join(', ');
    msg.className = 'msg ok';
    msg.textContent = `Queued ${r.queued.length} episode${r.queued.length === 1 ? '' : 's'}` + (skipped ? ` · skipped: ${skipped}` : '');
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = e.message;
  }
  btn.disabled = false;
  refresh();
}

function episodes(meta, box, seriesId) {
  const vids = (meta.videos || []).filter((v) => v.season > 0);
  const seasons = [...new Set(vids.map((v) => v.season))].sort((a, b) => a - b);
  if (!seasons.length) return box.replaceChildren(el('div', { className: 's', textContent: 'No episodes found.' }));
  const sel = el('select');
  seasons.forEach((s) => sel.append(el('option', { value: s, textContent: 'Season ' + s })));
  const msg = el('div', { className: 'msg' });
  const seasonBtn = el('button', { type: 'button', textContent: 'Download season' });
  const showBtn = el('button', { type: 'button', textContent: 'Download whole show', title: `All ${seasons.length} seasons, skipping what is already on the server` });
  seasonBtn.onclick = () => batchDownload(seriesId, +sel.value, seasonBtn, msg);
  showBtn.onclick = () => batchDownload(seriesId, null, showBtn, msg);
  const list = el('div');
  const now = Date.now();
  const render = () => {
    if (!box.isConnected) return openLists.delete(render);
    list.replaceChildren();
    vids.filter((v) => v.season === +sel.value).sort((a, b) => a.episode - b.episode).forEach((v) => {
      const st = epState(v.id);
      const future = v.released && Date.parse(v.released) > now;
      const b = el('button', { type: 'button', textContent: st && st.cls === 'err' ? 'Retry' : 'Download' });
      b.disabled = !!(st && st.busy) || future;
      b.onclick = () => startDownload('series', v.id, b);
      const state = el('span', { className: 'msg ' + (st && st.cls ? st.cls : ''), textContent: future ? 'Not released yet' : st ? st.text : '', title: (st && st.title) || '' });
      const choose = el('button', { type: 'button', textContent: '...', title: 'Choose a specific torrent' });
      choose.disabled = future;
      choose.onclick = () => openPicker('series', v.id, `${meta.name || seriesId} S${v.season}E${v.episode}`);
      list.append(el('div', { className: 'ep' }, el('span', { className: 'grow', textContent: `${v.episode}. ${v.name || v.title || ''}` }), state, b, choose));
    });
  };
  sel.onchange = render;
  box.replaceChildren(el('div', { className: 'row' }, sel, seasonBtn, showBtn), msg, list);
  openLists.add(render);
  render();
}

// ---- manual torrent picker ----
$('#pickClose').onclick = () => $('#picker').close();

async function openPicker(type, id, label) {
  const dlg = $('#picker');
  $('#pickTitle').textContent = 'Choose a torrent: ' + label;
  const body = $('#pickBody');
  body.replaceChildren(el('div', { className: 'msg', textContent: 'Searching...' }));
  if (!dlg.open) dlg.showModal();
  let data;
  try {
    data = await api(`api/candidates/${type}/${encodeURIComponent(id)}`);
  } catch (e) {
    return body.replaceChildren(el('div', { className: 'msg err', textContent: e.message }));
  }
  if (!data.candidates.length) return body.replaceChildren(el('div', { className: 'msg', textContent: 'No torrents found.' }));
  body.replaceChildren(...data.candidates.map((c) => {
    const isCurrent = c.infoHash === data.current;
    const facts = [c.res ? c.res + 'p' : '', c.size ? fmtBytes(c.size) : '', `${c.seeders} seeders`, c.languages.join('/'), c.pack ? 'season pack' : '', c.source].filter(Boolean).join(' · ');
    // Above the resolution cap the score is only a sort key, so leave it out.
    const why = c.rejected ? 'Filtered out: ' + c.rejected : c.reasons.join(', ') + (c.score > -500 ? ` (score ${c.score})` : '');
    const b = el('button', { type: 'button', textContent: isCurrent ? 'Current' : 'Download', className: c.rejected ? '' : 'primary' });
    b.disabled = isCurrent;
    b.onclick = async () => {
      if (data.current && !confirm('Replace the current torrent with this one?\nThe current one is removed from the torrent client; files already downloaded stay on disk.')) return;
      b.disabled = true; b.textContent = 'Starting...';
      try {
        await send('POST', 'api/download', { type, id, infoHash: c.infoHash });
        dlg.close();
      } catch (e) {
        b.disabled = false; b.textContent = 'Failed'; b.title = e.message;
      }
      refresh();
    };
    return el('div', { className: 'cand' + (c.rejected ? ' rejected' : '') + (isCurrent ? ' current' : '') },
      el('div', { className: 'grow' }, el('div', { className: 't', textContent: c.title }), el('div', { className: 's', textContent: facts }), el('div', { className: 's', textContent: why })),
      b);
  }));
}

let searchSeq = 0; // a slow search that finishes after a newer one must not overwrite its results
async function search(e) {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  const seq = ++searchSeq;
  const out = $('#results');
  const status = el('div', { className: 's', textContent: 'Searching...' });
  out.replaceChildren(status);
  const slow = setTimeout(() => (status.textContent = 'Searching... Cinemeta is slow for new searches, this can take up to 45 s'), 5000);
  try {
    const { metas = [] } = await api(`api/search?type=${type}&q=${encodeURIComponent(q)}`);
    if (seq !== searchSeq) return;
    out.replaceChildren();
    metas.slice(0, 12).forEach((m) => {
      const id = m.imdb_id || m.id;
      const btn = el('button', { textContent: type === 'movie' ? 'Download' : 'Episodes' });
      const epBox = el('div', { className: 'eps' });
      epBox.hidden = true;
      btn.onclick = async () => {
        if (type === 'movie') return startDownload('movie', id, btn);
        epBox.hidden = !epBox.hidden;
        if (!epBox.hidden && !epBox.children.length) {
          try { episodes((await api(`api/meta/series/${id}`)).meta || {}, epBox, id); }
          catch (err) { epBox.textContent = err.message; }
        }
      };
      const buttons = [btn];
      if (type === 'movie') {
        const choose = el('button', { type: 'button', textContent: 'Choose...', title: 'Pick a specific torrent' });
        choose.onclick = () => openPicker('movie', id, m.name);
        buttons.push(choose);
      }
      out.append(
        el('div', { className: 'item' },
          el('img', { src: m.poster || '', alt: '', loading: 'lazy' }),
          el('div', { className: 'grow' }, el('div', { className: 't', textContent: m.name }), el('div', { className: 's', textContent: `${m.releaseInfo || ''} ${id}` })),
          ...buttons),
        epBox);
    });
    if (!metas.length) out.textContent = 'No results.';
  } catch (err) {
    if (seq === searchSeq) out.textContent = 'Search failed: ' + err.message;
  } finally {
    clearTimeout(slow);
  }
}
$('#f').onsubmit = search;

const fmtBytes = (n) => {
  if (!n && n !== 0) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`;
};
const fmtEta = (s) => (s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m` : s >= 60 ? `${Math.round(s / 60)}m` : `${s}s`);

function statusText(d) {
  const pct = Math.round((d.progress || 0) * 100);
  if (d.status === 'error') return 'Error: ' + (d.error || '');
  if (d.status === 'missing') return 'Not downloaded (removed)';
  if (d.status === 'complete') return 'On your server' + (d.inClient ? '' : ' (removed from torrent client)');
  const parts = [d.paused ? `Paused at ${pct}%` : d.status === 'queued' ? 'Queued' : `Downloading ${pct}%`];
  if (d.paused) return parts.join(' · ');
  // Why nothing arrives: the client's own queue, missing torrent info, or no one to download from.
  if (d.clientState === 'queued') parts.push("waiting in the torrent client's queue");
  else if (d.clientState === 'metadata') parts.push('fetching torrent info');
  else if (d.clientState === 'checking') parts.push('checking files');
  else if (d.inClient && !d.dlSpeed) parts.push(d.seeds === 0 ? 'no seeders connected' : 'stalled');
  if (d.dlSpeed) parts.push(fmtBytes(d.dlSpeed) + '/s');
  if (d.eta) parts.push(fmtEta(d.eta) + ' left');
  const still = d.progressAt ? Math.floor((Date.now() - d.progressAt) / 1000) : 0;
  if (still >= 120) parts.push(`no progress for ${fmtEta(still)}`);
  if (d.tried) parts.push(`trying torrent ${d.tried + 1}`);
  return parts.join(' · ');
}

// Runs a per-item action and refreshes the list. `confirmText` asks first.
async function action(d, name, method, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try {
    await api(`api/downloads/${encodeURIComponent(d.id)}${name ? '/' + name : ''}`, { method });
  } catch (e) {
    alert(`${name || 'forget'} failed: ${e.message}`);
  }
  refresh();
}

function itemButtons(d) {
  const label = d.label || d.title || d.id;
  const out = [];
  const btn = (text, fn, title) => { const b = el('button', { type: 'button', textContent: text, title: title || '' }); b.onclick = fn; out.push(b); };
  const active = d.status === 'queued' || d.status === 'downloading';
  if (active && d.inClient) {
    if (d.paused) btn('Resume', () => action(d, 'resume', 'POST'));
    else btn('Pause', () => action(d, 'pause', 'POST'), d.shared ? 'Pauses the whole torrent (shared with other episodes)' : '');
  }
  if (d.status === 'complete' || d.status === 'downloading') {
    out.push(el('a', { className: 'btn', textContent: 'Play', target: '_blank', rel: 'noopener', href: `play/${d.type}/${encodeURIComponent(d.id)}`, title: 'Open in the browser, or copy the link into VLC' }));
  }
  if (d.status === 'error' || d.status === 'missing') btn('Re-download', () => action(d, 'redownload', 'POST'));
  if (d.inClient) {
    btn('Remove', () => action(d, 'remove', 'POST',
      `Remove "${label}" from the torrent client?\nFiles stay on disk${d.status === 'complete' ? ' and it stays playable' : ''}.`),
      'Remove from the torrent client, keep files');
  }
  if (d.fileName || d.inClient) {
    btn('Delete files', () => action(d, 'delete-files', 'POST',
      `Permanently delete "${label}" from disk?\n${d.fileName || ''}\nThis cannot be undone.`));
  }
  btn('✕', () => action(d, '', 'DELETE', `Forget "${label}"? The torrent client and the files are not touched.`), 'Forget (remove from this list only)');
  return out;
}

async function refresh() {
  let data;
  try {
    data = await api('api/downloads');
  } catch { return; }
  known = new Map(data.items.map((d) => [d.id, d]));
  pendingIds = new Set(data.batchPending || []);
  openLists.forEach((render) => render());
  const box = $('#downloads');
  box.replaceChildren();
  if (pendingIds.size) box.append(el('div', { className: 'msg', textContent: `Looking for torrents for ${pendingIds.size} more episode${pendingIds.size === 1 ? '' : 's'}...` }));
  if (data.clientError) box.append(el('div', { className: 'msg err', textContent: 'Torrent client unreachable: ' + data.clientError }));
  if (!data.items.length) box.append(el('div', { className: 's', textContent: 'Nothing yet. Search for something under Add.' }));
  data.items.forEach((d) => {
    const pct = Math.round((d.progress || 0) * 100);
    const meta = [d.id, d.size ? fmtBytes(d.size) : '', statusText(d)].filter(Boolean).join(' · ');
    box.append(
      el('div', { className: 'item dl ' + d.status + (d.paused ? ' paused' : '') },
        el('div', { className: 'grow' },
          el('div', { className: 't', textContent: d.label || d.title || d.id, title: d.title || '' }),
          el('div', { className: 's', textContent: meta, title: d.fileName || '' }),
          el('div', { className: 'bar' }, el('div', { style: `width:${pct}%` })),
          el('div', { className: 'actions' }, ...itemButtons(d)))));
  });
}
// ---- settings ----
let current = null;

function fieldInput(f, value) {
  if (f.options) {
    const sel = el('select', { name: f.key });
    f.options.forEach((o) => sel.append(el('option', { value: o.value, textContent: o.label })));
    sel.value = value;
    return sel;
  }
  const input = el('input', { name: f.key, value: value ?? '', autocomplete: 'off', spellcheck: false });
  if (f.type === 'int') input.inputMode = 'numeric';
  if (f.type === 'url') input.type = 'url';
  if (f.type === 'secret') {
    input.type = 'password';
    input.autocomplete = 'new-password';
    input.placeholder = current.secretsSet[f.key] ? '(saved; leave empty to keep)' : '(not set)';
  }
  return input;
}

// Connection test for one client, using what is in the form right now (blank password = saved one).
function testButton(client, keys) {
  const msg = el('span', { className: 'msg' });
  const btn = el('button', { type: 'button', textContent: 'Test connection' });
  btn.onclick = async () => {
    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Testing...';
    try {
      const r = await send('POST', 'api/settings/test-client', { client, values: formValues(keys) });
      msg.className = 'msg ' + (!r.ok ? 'err' : r.warning ? 'warn' : 'ok');
      msg.textContent = r.ok ? `Connected: ${r.version}` + (r.warning ? `. ${r.warning}` : '') : 'Failed: ' + r.error;
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    btn.disabled = false;
  };
  return el('div', { className: 'row' }, btn, msg);
}

// Only the selected client's connection fields are shown; the others keep their values.
function showClientGroups() {
  const chosen = $('#settingsForm').elements.torrentClient.value;
  document.querySelectorAll('fieldset[data-client]').forEach((fs) => (fs.hidden = fs.dataset.client !== chosen));
}

function renderSettings() {
  const form = $('#settingsForm');
  form.replaceChildren();
  const groups = new Map();
  for (const f of current.fields) {
    if (!groups.has(f.group)) {
      const fs = el('fieldset', {}, el('legend', { textContent: f.group }));
      if (f.client) fs.dataset.client = f.client;
      groups.set(f.group, fs);
      form.append(fs);
    }
    const label = el('label', { textContent: f.label });
    if (current.overridden.includes(f.key)) {
      const reset = el('a', { className: 'reset', textContent: 'reset to default', title: 'Default: ' + (current.defaults[f.key] || '(empty)') });
      reset.onclick = () => saveSettings({ [f.key]: null });
      label.append(reset);
    }
    const box = el('div', { className: 'field', id: 'f-' + f.key }, label, fieldInput(f, current.values[f.key]));
    if (f.help) box.append(el('div', { className: 'help', textContent: f.help }));
    groups.get(f.group).append(box);
  }
  for (const [group, fs] of groups) {
    if (!fs.dataset.client) continue;
    const keys = current.fields.filter((f) => f.group === group).map((f) => f.key);
    fs.append(testButton(fs.dataset.client, keys));
  }
  form.elements.torrentClient.onchange = showClientGroups;
  showClientGroups();
  const status = el('span', { className: 'msg', id: 'saveMsg' });
  form.append(el('div', { className: 'row' }, el('button', { className: 'primary', textContent: 'Save settings' }), status));
  $('#manifestUrl').textContent = new URL('manifest.json', location.origin + BASE).href;
}

function formValues(keys) {
  const out = {};
  for (const k of keys) {
    const input = $('#settingsForm').elements[k];
    if (input) out[k] = input.value;
  }
  return out;
}

async function saveSettings(patch) {
  document.querySelectorAll('.field.bad').forEach((x) => x.classList.remove('bad'));
  const msg = $('#saveMsg');
  try {
    current = await send('PUT', 'api/settings', patch);
    renderSettings();
    $('#saveMsg').className = 'msg ok';
    $('#saveMsg').textContent = 'Saved. Changes apply right away.';
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
    const bad = e.field && $('#f-' + e.field);
    if (bad) { bad.classList.add('bad'); bad.closest('fieldset').hidden = false; }
  }
}

$('#settingsForm').onsubmit = (e) => {
  e.preventDefault();
  const patch = {};
  for (const f of current.fields) {
    const v = $('#settingsForm').elements[f.key].value;
    if (f.type === 'secret') { if (v !== '') patch[f.key] = v; continue; }
    if (String(v) !== String(current.values[f.key] ?? '')) patch[f.key] = v; // ints too: the server parses and validates them (Number('abc') would turn into null = reset)
  }
  saveSettings(patch);
};

async function loadSettings() {
  try {
    current = await api('api/settings');
    renderSettings();
  } catch (e) {
    $('#settingsForm').textContent = 'Could not load settings: ' + e.message;
  }
}

$('#rotate').onclick = async () => {
  if (!confirm('Create a new secret URL? The current URL (and the add-on installed in Stremio) stops working right away.')) return;
  try {
    const r = await send('POST', 'api/settings/rotate-token');
    location.href = new URL(r.uiUrl).pathname + '#settings';
  } catch (e) {
    alert('Rotating failed: ' + e.message);
  }
};

show();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
